[project]
name = "opai-bench"
dynamic = ["version"]
description = "Benchmarks for Open Photo AI: lens blur against ground truth, FP16 against FP32, models against each other, and the sharpen/denoise quality tier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joseph Reagle" }]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
    "pyarrow",
    "rich",
    # Reads Spring's disparity (HDF5). No wheels for Python 3.15 yet (h5py 3.16), and
    # building it needs a system HDF5: on 3.15 everything but the Spring depth scores
    # runs (`run --only aim`); .python-version pins 3.14, where all of it does.
    "h5py; python_version < '3.15'",
]

[project.scripts]
opai-bench = "opai_bench.cli:main"

[dependency-groups]
dev = ["ruff", "pyright", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/opai_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opai_bench"]

[tool.ruff]
src = ["src", "tests"]
# Same as Black.
line-length = 88

lint.select = [
"A", # flake8-builtins        https://tinyurl.com/ruff-rules#flake8-builtins-a
"B", # Flake8-bugbear         https://tinyurl.com/ruff-rules#flake8-bugbear-b
"BLE", # Flake8-blind-except  https://tinyurl.com/ruff-rules#flake8-blind-except-ble
"C4", # Flake8-comprehensions https://tinyurl.com/ruff-rules#flake8-comprehensions-c4
"C90", # McCabe complexity    https://tinyurl.com/ruff-rules#mccabe-c90
"D", # Pydocstyle             https://tinyurl.com/ruff-rules#pydocstyle-d
"E", # Pycodestyle errors     https://tinyurl.com/ruff-rules#pycodestyle-e-w
"F", # Pyflakes               https://tinyurl.com/ruff-rules#pyflakes-f
"I", # Isort                  https://tinyurl.com/ruff-rules#isort-i
"PIE", # Flake8-pie           https://tinyurl.com/ruff-rules#flake8-pie-pie
"PLR", # Pylint refactor      https://tinyurl.com/ruff-rules#pylint-pl
"PTH", # Flake8-use-pathlib   https://tinyurl.com/ruff-rules#flake8-use-pathlib-pth
"Q", # Flake8-quotes          https://tinyurl.com/ruff-rules#flake8-quotes-q
"RSE", # Flake8-raise         https://tinyurl.com/ruff-rules#flake8-raise-rse
"RUF", # Ruff-specific        https://tinyurl.com/ruff-rules#ruff-specific-rules-ruf
"SIM", # Flake8-simplify      https://tinyurl.com/ruff-rules#flake8-simplify-sim
"UP", # Pyupgrade             https://tinyurl.com/ruff-rules#pyupgrade-up
"W505", # Doc line too long   https://tinyurl.com/ruff-rules#pycodestyle-e-w
"YTT", # Flake8-2020          https://tinyurl.com/ruff-rules#flake8-2020-ytt
]

lint.ignore = [
"D102", # Missing docstring in public method
"D203", # Incompatible with D211 (no-blank-line-before-class)
"D213", # Incompatible with D212 (multi-line-summary-second-line)
"D107", # Missing docstring in __init__
"E501", # long DATA lines (prompts, embedded HTML/JS, URLs); prose is W505 below
"PLR0912", # Too many branches in function or method
"PLR0915", # Too many statements in function or method
"PLR0913", # Too many arguments to function call
"PLR2004", # Magic value used in comparison
"RUF001", # String contains ambiguous Unicode character (curly quotes)
"RUF002", # Docstring contains ambiguous Unicode character (curly quotes)
"SIM105", # I don't mind try/except
]

lint.unfixable = [
"F401", # keep unused modules as I'm likely to use them soon
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# E501 (physical lines) stays ignored, because it cannot tell a doctest or an LLM
# prompt from a comment. W505 does that job instead: it checks only "doc" lines --
# comments AND docstrings -- so prose is held to 88 while data strings are left alone.
[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.mccabe] # enabled via "C90" above
max-complexity = 10

[tool.pyright]
include = ["src", "tests", "bench.py"]
# The floor of requires-python, so nothing newer creeps in.
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-r a -q --doctest-modules"
# Doctests in the modules are the main tests; tests/ holds what they cannot express.
testpaths = ["src", "tests"]
filterwarnings = "ignore::DeprecationWarning"
